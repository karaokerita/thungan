<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Thu ngân Karaoke</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Supabase JS Library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.1.0/400.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.1.0/600.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.1.0/700.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.1.0/800.css" />
  <style>
    :root {
      --primary: #6366f1; --primary-dark: #4f46e5;
      --success: #10b981; --success-dark: #059669;
      --danger: #ef4444; --danger-dark: #dc2626;
      --warning: #f59e0b;
      --bg: #f1f5f9; --card: #ffffff; --text: #1e293b;
      --text-secondary: #64748b; --border: #e2e8f0;
      --shadow: 0 4px 24px rgba(0,0,0,0.08); --radius: 14px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: var(--bg); min-height: 100vh; color: var(--text); }
    
    /* Password Overlay */
    #passwordOverlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(8px);
      z-index: 9999; display: flex; justify-content: center; align-items: center;
    }
    .password-box {
      background: white; padding: 32px; border-radius: var(--radius);
      box-shadow: var(--shadow); text-align: center; width: 320px;
    }
    .password-box h2 { margin-bottom: 20px; color: var(--primary); }
    .password-box input {
      width: 100%; padding: 12px; border: 2px solid var(--border);
      border-radius: 10px; font-size: 18px; text-align: center;
      letter-spacing: 4px; margin-bottom: 16px; outline: none;
    }
    .password-box input:focus { border-color: var(--primary); }
    .password-box button {
      width: 100%; padding: 12px; background: var(--primary); color: white;
      border: none; border-radius: 10px; font-size: 16px; font-weight: 700;
      cursor: pointer; transition: 0.2s;
    }
    .password-box button:hover { background: var(--primary-dark); }
    .error-msg { color: var(--danger); font-size: 13px; margin-top: 8px; display: none; }

    .app-header {
      background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #a78bfa 100%);
      color: white; text-align: center; padding: 32px 20px 28px;
    }
    .app-header h1 { font-size: 28px; font-weight: 800; letter-spacing: -0.5px; }
    .app-header h1 span { display: block; font-size: 15px; font-weight: 600; opacity: 0.9; margin-top: 4px; letter-spacing: 2px; text-transform: uppercase; }
    #currentTime { font-weight: 600; font-size: 14px; margin-top: 12px; background: rgba(255,255,255,0.15); display: inline-block; padding: 6px 18px; border-radius: 20px; }

    .container { max-width: 1100px; margin: 24px auto; padding: 0 16px; }
    .card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; border: 1px solid var(--border); }
    .table-wrapper { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    thead th {
      background: linear-gradient(135deg, #f8fafc, #f1f5f9); color: var(--text-secondary);
      font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px;
      padding: 16px 14px; border-bottom: 2px solid var(--border); text-align: center;
    }
    tbody tr { transition: all 0.3s ease; border-bottom: 1px solid var(--border); }
    tbody tr:hover { background: #f8fafc; }
    tbody td { padding: 14px; text-align: center; vertical-align: middle; font-size: 14px; }
    
    .room-name { font-weight: 700; font-size: 16px; color: var(--text); }
    .amount-input {
      width: 140px; padding: 10px 12px; border: 2px solid var(--border);
      border-radius: 10px; font-size: 15px; font-weight: 600; text-align: right;
      background: #f8fafc; transition: all 0.2s ease;
    }
    .amount-input:focus { outline: none; border-color: var(--primary); background: white; box-shadow: 0 0 0 4px rgba(99,102,241,0.1); }

    .btn {
      padding: 8px 14px; border: none; border-radius: 10px; cursor: pointer;
      font-size: 13px; font-weight: 600; transition: all 0.2s ease;
      display: inline-flex; align-items: center; gap: 6px;
    }
    .btn:active { transform: scale(0.96); }
    .btn:disabled { opacity: 0.35; cursor: not-allowed; box-shadow: none !important; }
    
    .btn-open { background: linear-gradient(135deg, #0ea5e9, #38bdf8); color: white; box-shadow: 0 2px 8px rgba(14,165,233,0.3); }
    .btn-open:hover:not(:disabled) { background: linear-gradient(135deg, #0284c7, #0ea5e9); }
    
    .btn-update { background: linear-gradient(135deg, var(--success), #34d399); color: white; box-shadow: 0 2px 8px rgba(16,185,129,0.3); }
    .btn-update:hover:not(:disabled) { background: linear-gradient(135deg, var(--success-dark), var(--success)); }
    .btn-update.enabled { animation: pulse-green 1.5s ease-in-out infinite; }
    @keyframes pulse-green { 0%, 100% { box-shadow: 0 2px 8px rgba(16,185,129,0.3); } 50% { box-shadow: 0 2px 16px rgba(16,185,129,0.5); } }
    
    .btn-paid { background: linear-gradient(135deg, var(--danger), #f87171); color: white; box-shadow: 0 2px 8px rgba(239,68,68,0.3); }
    .btn-paid:hover:not(:disabled) { background: linear-gradient(135deg, var(--danger-dark), var(--danger)); }

    .status-badge { display: inline-block; padding: 5px 14px; border-radius: 20px; font-size: 12px; font-weight: 700; }
    .status-chua-mo { background: #f1f5f9; color: #64748b; }
    .status-dang-mo { background: #dbeafe; color: #1e40af; }
    .status-da-thanh-toan { background: #d1fae5; color: #065f46; }

    .loading-overlay {
      display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.3); backdrop-filter: blur(2px); z-index: 1000;
      justify-content: center; align-items: center;
    }
    .loading-overlay.active { display: flex; }
    .spinner { width: 44px; height: 44px; border: 4px solid rgba(255,255,255,0.3); border-top-color: white; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <!-- Password Overlay -->
  <div id="passwordOverlay">
    <div class="password-box">
      <h2>🔒 Nhập mật khẩu</h2>
      <input type="password" id="passwordInput" placeholder="••••" maxlength="4">
      <button onclick="checkPassword()">Đăng nhập</button>
      <div class="error-msg" id="errorMsg">Mật khẩu không đúng!</div>
    </div>
  </div>

  <div class="loading-overlay" id="loadingOverlay"><div class="spinner"></div></div>

  <header class="app-header">
    <h1>THU NGÂN <span>Karaoke Rita</span></h1>
    <div id="currentTime"></div>
  </header>

  <div class="container">
    <div class="card">
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>Phòng</th>
              <th>Số tiền</th>
              <th>Hành động</th>
              <th>Trạng thái</th>
              <th>Thời gian</th>
            </tr>
          </thead>
          <tbody id="roomTable"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    // ================= CẤU HÌNH =================
    const SUPABASE_URL = 'https://nmgofzqtebcnfhttaudy.supabase.co/rest/v1/'; // Thay bằng URL của bạn
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5tZ29menF0ZWJjbmZodHRhdWR5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY1OTQ3NzQsImV4cCI6MjEwMjE3MDc3NH0.R9sPaChT0I96n42zSVI5umCITV9G7y-H2cl18qK3RMY'; // Thay bằng Anon Key của bạn
    const PASSWORD = '6868';
    const ROOMS = ['Phong 3', 'Phong 4', 'Phong 5', 'Phong 6', 'Phong 7', 'Phong 8', 'Phong 9'];
    
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // ================= XỬ LÝ MẬT KHẨU =================
    function checkPassword() {
      const input = document.getElementById('passwordInput').value;
      if (input === PASSWORD) {
        document.getElementById('passwordOverlay').style.display = 'none';
        loadRooms();
      } else {
        document.getElementById('errorMsg').style.display = 'block';
        document.getElementById('passwordInput').value = '';
      }
    }
    document.getElementById('passwordInput').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') checkPassword();
    });

    // ================= TIỆN ÍCH =================
    const formatNumber = n => n ? Number(n).toLocaleString("vi-VN") : "0";
    const parseNumber = str => Number(str.replace(/\./g, "").replace(/,/g, "")) || 0;
    const getCurrentTime = () => new Date().toLocaleTimeString("vi-VN", { hour: '2-digit', minute: '2-digit', hour12: false });
    
    function showLoading(show) {
      document.getElementById('loadingOverlay').classList.toggle('active', show);
    }

    // Map trạng thái không dấu sang có dấu để hiển thị
    const statusMap = {
      'chua mo': { text: 'Chưa mở', class: 'status-chua-mo' },
      'dang mo': { text: 'Đang mở', class: 'status-dang-mo' },
      'da thanh toan': { text: 'Đã thanh toán', class: 'status-da-thanh-toan' }
    };

    // ================= LOGIC CHÍNH =================
    async function loadRooms() {
      showLoading(true);
      try {
        const { data, error } = await supabase.from('thungan').select('*').order('ten_phong', { ascending: true });
        if (error) throw error;

        // Kiểm tra và tự động reset nếu đã qua 5:00 sáng và chưa reset hôm nay
        await checkAndResetDaily(data);

        // Fetch lại dữ liệu sau khi có thể đã reset
        const { data: finalData } = await supabase.from('thungan').select('*').order('ten_phong', { ascending: true });
        renderTable(finalData);
      } catch (err) {
        console.error("Lỗi tải dữ liệu:", err);
        alert("Không thể kết nối đến cơ sở dữ liệu!");
      } finally {
        showLoading(false);
      }
    }

    async function checkAndResetDaily(currentData) {
      const now = new Date();
      const currentHour = now.getHours();
      const todayStr = now.toISOString().split('T')[0];

      // Nếu là sau 5 giờ sáng và ngày cập nhật cuối cùng không phải hôm nay
      if (currentHour >= 5 && currentData.length > 0 && currentData[0].ngay_cap_nhat < todayStr) {
        console.log("Đang thực hiện reset dữ liệu ngày mới...");
        for (const room of ROOMS) {
          await supabase.from('thungan').update({
            trang_thai: 'chua mo',
            so_tien: 0,
            thoi_gian: '00:00',
            ngay_cap_nhat: todayStr
          }).eq('ten_phong', room);
        }
      }
    }

    function renderTable(data) {
      const table = document.getElementById("roomTable");
      table.innerHTML = "";

      data.forEach(room => {
        const tr = document.createElement("tr");
        const statusInfo = statusMap[room.trang_thai] || statusMap['chua mo'];
        const currentAmount = parseNumber(document.getElementById(`amount-${room.ten_phong}`)?.value || 0);
        const dbAmount = room.so_tien || 0;
        const isAmountChanged = currentAmount !== dbAmount;

        // Xác định trạng thái nút bấm
        const isChuaMo = room.trang_thai === 'chua mo';
        const isDangMo = room.trang_thai === 'dang mo';
        const isDaThanhToan = room.trang_thai === 'da thanh toan';

        const openDisabled = isDangMo;
        const paidDisabled = !isDangMo;
        const updateDisabled = !isDangMo || !isAmountChanged;

        tr.innerHTML = `
          <td><span class="room-name">${room.ten_phong.replace('Phong', 'Phòng')}</span></td>
          <td>
            <input type="text" class="amount-input" id="amount-${room.ten_phong}" 
              value="${formatNumber(room.so_tien)}" 
              oninput="onAmountChange('${room.ten_phong}')"
              onkeypress="if(event.key==='Enter'){updateAmount('${room.ten_phong}')}">
          </td>
          <td>
            <div style="display:flex; gap:6px; justify-content:center; flex-wrap:wrap;">
              <button class="btn btn-open" ${openDisabled ? 'disabled' : ''} onclick="openRoom('${room.ten_phong}')">
                🔓 Mở phòng
              </button>
              <button class="btn btn-update ${!updateDisabled ? 'enabled' : ''}" ${updateDisabled ? 'disabled' : ''} onclick="updateAmount('${room.ten_phong}')">
                💾 Cập nhật
              </button>
              <button class="btn btn-paid" ${paidDisabled ? 'disabled' : ''} onclick="markPaid('${room.ten_phong}')">
                ✅ Thanh toán
              </button>
            </div>
          </td>
          <td><span class="status-badge ${statusInfo.class}">${statusInfo.text}</span></td>
          <td style="color:var(--text-secondary); font-weight:600;">${room.thoi_gian}</td>
        `;
        table.appendChild(tr);
      });
    }

    // ================= HÀNH ĐỘNG =================
    async function openRoom(roomName) {
      showLoading(true);
      const timeNow = getCurrentTime();
      const { error } = await supabase.from('thungan').update({
        trang_thai: 'dang mo',
        so_tien: 0,
        thoi_gian: timeNow
      }).eq('ten_phong', roomName);
      
      if (!error) await loadRooms();
      showLoading(false);
    }

    function onAmountChange(roomName) {
      const input = document.getElementById(`amount-${roomName}`);
      const raw = input.value.replace(/\./g, "").replace(/,/g, "");
      input.value = raw ? Number(raw).toLocaleString("vi-VN") : "";
      
      // Kích hoạt nút cập nhật
      const btn = document.querySelector(`button[onclick="updateAmount('${roomName}')"]`);
      if (btn && btn.disabled) {
        btn.disabled = false;
        btn.classList.add('enabled');
      }
    }

    async function updateAmount(roomName) {
      const input = document.getElementById(`amount-${roomName}`);
      const amount = parseNumber(input.value);
      
      showLoading(true);
      const { error } = await supabase.from('thungan').update({
        so_tien: amount
      }).eq('ten_phong', roomName);

      if (!error) await loadRooms();
      showLoading(false);
    }

    async function markPaid(roomName) {
      showLoading(true);
      const { error } = await supabase.from('thungan').update({
        trang_thai: 'da thanh toan'
      }).eq('ten_phong', roomName);

      if (!error) await loadRooms();
      showLoading(false);
    }

    // ================= ĐỒNG HỒ =================
    function updateClock() {
      const now = new Date();
      const days = ["Chủ Nhật","Thứ Hai","Thứ Ba","Thứ Tư","Thứ Năm","Thứ Sáu","Thứ Bảy"];
      const time = now.toLocaleTimeString("vi-VN", { hour12: false });
      const date = now.toLocaleDateString("vi-VN");
      document.getElementById("currentTime").innerText = `${time} • ${days[now.getDay()]}, ${date}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Tự động làm mới dữ liệu mỗi 30 giây để đồng bộ nếu có nhiều máy thu ngân
    setInterval(loadRooms, 30000);
  </script>
</body>
</html>
